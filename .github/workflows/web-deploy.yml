name: Web Deploy Check

on:
  push:
    branches: [main, trial]
  pull_request:
    branches: [main]

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      # 資格引擎與補助資料的回歸測試在這裡：資料重建後把使用者能領的項目判成不符合，這一步會擋下來
      - name: Unit tests
        run: npm test

      # next/font 在 build 時向 Google Fonts 下載 Noto Sans TC，偶爾會連不上，整個 build 就以 module-not-found 失敗
      # （2026-11-14 的 run 43645099267 發生過，和程式碼無關）。失敗時等 10 秒重試一次。
      - name: Build (web mode)
        run: npm run build || (echo "第一次 build 失敗，10 秒後重試一次" && sleep 10 && npm run build)
