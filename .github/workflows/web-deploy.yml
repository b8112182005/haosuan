name: Web Deploy Check

on:
  push:
    branches: [main, trial]
  pull_request:
    branches: [main]

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      # 資格引擎與補助資料的回歸測試在這裡：資料重建後把使用者能領的項目判成不符合，這一步會擋下來
      - name: Unit tests
        run: npm test

      - name: Build (web mode)
        run: npm run build
