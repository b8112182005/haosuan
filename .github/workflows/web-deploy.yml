name: Web Deploy Check

on:
  push:
    branches: [main, trial]
  pull_request:
    branches: [main]

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build (web mode)
        run: npm run build

      - name: Build success notification
        run: echo "✅ Web build passed — Railway will auto-deploy"
