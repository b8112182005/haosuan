import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// ---- 版本號 ----
// versionCode：每次上傳 Play 都要比上次大。CI 用 -PversionCode=<github.run_number> 傳進來，本機沒傳就是 1。
// versionName：-PversionName=1.2.3 可覆寫（CI 從 tag v1.2.3 帶入）；沒傳就讀 repo 根目錄 package.json 的 version，
// 讓網頁和 app 共用同一個版本號，不用在兩邊各改一次。
def packageJson = new JsonSlurper().parse(rootProject.file('../package.json'))
def appVersionCode = (findProperty('versionCode') ?: '1').toString().toInteger()
def appVersionName = (findProperty('versionName') ?: packageJson.version).toString()

// ---- Release 簽章 ----
// 優先序：android/keystore.properties（gitignored，本機用）> 環境變數 ANDROID_KEYSTORE_*（CI 用）
// 兩者都沒有就退回 debug 簽章，只是為了讓本機 bundleRelease 跑得起來；那個 AAB 不能上傳 Play。
// 有設定但設不完整（例如少密碼、keystore 檔不存在）則直接報錯，不要悄悄退回 debug 簽章讓人白跑一次上傳。
def keystorePropsFile = rootProject.file('keystore.properties')
def releaseSigning = null
if (keystorePropsFile.exists()) {
    def props = new Properties()
    keystorePropsFile.withInputStream { props.load(it) }
    releaseSigning = [
        source       : keystorePropsFile.path,
        storeFile    : rootProject.file(props.getProperty('storeFile') ?: ''),
        storePassword: props.getProperty('storePassword'),
        keyAlias     : props.getProperty('keyAlias'),
        keyPassword  : props.getProperty('keyPassword'),
    ]
} else if (System.getenv('ANDROID_KEYSTORE_PATH')) {
    releaseSigning = [
        source       : 'ANDROID_KEYSTORE_* 環境變數',
        storeFile    : rootProject.file(System.getenv('ANDROID_KEYSTORE_PATH')),
        storePassword: System.getenv('ANDROID_KEYSTORE_PASSWORD'),
        keyAlias     : System.getenv('ANDROID_KEY_ALIAS'),
        keyPassword  : System.getenv('ANDROID_KEY_PASSWORD'),
    ]
}
if (releaseSigning != null) {
    def missing = ['storePassword', 'keyAlias', 'keyPassword'].findAll { !releaseSigning[it] }
    if (!missing.isEmpty()) {
        throw new GradleException("release 簽章設定（${releaseSigning.source}）不完整，缺少：${missing.join(', ')}")
    }
    if (!releaseSigning.storeFile.isFile()) {
        throw new GradleException("release 簽章設定（${releaseSigning.source}）指到的 keystore 不存在：${releaseSigning.storeFile}")
    }
} else {
    logger.warn("[haoti] 沒有 android/keystore.properties 也沒有 ANDROID_KEYSTORE_* 環境變數：release 改用 debug 簽章（只能本機測試，不能上傳 Play）。產生金鑰：scripts/android/make-keystore.sh")
}

android {
    namespace = "com.haosuan.haoti"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.haosuan.haoti"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigning != null) {
            release {
                storeFile releaseSigning.storeFile
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig releaseSigning != null ? signingConfigs.release : signingConfigs.debug
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
